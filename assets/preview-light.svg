<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="A mock-up of the Brie Mine theme in light mode: a chat window over cheese holes and pink hearts">
<style>
  .drift { animation: rise linear infinite; }
  .bob { animation: bob ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes rise { from { transform: translateY(880px); } to { transform: translateY(-80px); } }
  @keyframes bob { from { transform: translateY(0) scale(1); } to { transform: translateY(-10px) scale(1.04); } }
  @media (prefers-reduced-motion: reduce) { .drift, .bob { animation: none; } }
</style>
<defs>
  <clipPath id="frame"><rect width="1200" height="760" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="760" fill="#f5e6b8"/>
  <ellipse cx="90" cy="110" rx="340" ry="250" fill="#fff6d8" opacity="0.55"/>
  <ellipse cx="1120" cy="680" rx="380" ry="260" fill="#fff6d8" opacity="0.55"/>
  <g class="bob" style="animation-duration:7s;animation-delay:0s"><circle fill="#fbefc6" cx="70" cy="150" r="59"/><circle fill="#e8cf86" cx="73" cy="153" r="52"/></g>
  <g class="bob" style="animation-duration:9s;animation-delay:-3s"><circle fill="#fbefc6" cx="230" cy="690" r="37"/><circle fill="#e8cf86" cx="233" cy="693" r="30"/></g>
  <g class="bob" style="animation-duration:8s;animation-delay:-5s"><circle fill="#fbefc6" cx="40" cy="470" r="45"/><circle fill="#e8cf86" cx="43" cy="473" r="38"/></g>
  <g class="bob" style="animation-duration:10s;animation-delay:-2s"><circle fill="#fbefc6" cx="1150" cy="110" r="49"/><circle fill="#e8cf86" cx="1153" cy="113" r="42"/></g>
  <g class="bob" style="animation-duration:7.5s;animation-delay:-6s"><circle fill="#fbefc6" cx="1165" cy="420" r="31"/><circle fill="#e8cf86" cx="1168" cy="423" r="24"/></g>
  <g class="bob" style="animation-duration:9.5s;animation-delay:-1s"><circle fill="#fbefc6" cx="1130" cy="700" r="65"/><circle fill="#e8cf86" cx="1133" cy="703" r="58"/></g>
  <g class="drift" style="animation-duration:22s;animation-delay:0s"><path fill="#e45a95" d="M0 6 C0 -2 12 -2 12 6 C12 -2 24 -2 24 6 C24 14 12 20 12 24 C12 20 0 14 0 6 Z" transform="translate(22 0) scale(1)" opacity="0.55"/></g>
  <g class="drift" style="animation-duration:30s;animation-delay:-11s"><path fill="#e45a95" d="M0 6 C0 -2 12 -2 12 6 C12 -2 24 -2 24 6 C24 14 12 20 12 24 C12 20 0 14 0 6 Z" transform="translate(8 0) scale(0.7)" opacity="0.4"/></g>
  <g class="drift" style="animation-duration:26s;animation-delay:-6s"><path fill="#e45a95" d="M0 6 C0 -2 12 -2 12 6 C12 -2 24 -2 24 6 C24 14 12 20 12 24 C12 20 0 14 0 6 Z" transform="translate(1160 0) scale(0.9)" opacity="0.5"/></g>
  <g class="drift" style="animation-duration:33s;animation-delay:-19s"><path fill="#e45a95" d="M0 6 C0 -2 12 -2 12 6 C12 -2 24 -2 24 6 C24 14 12 20 12 24 C12 20 0 14 0 6 Z" transform="translate(1176 0) scale(0.65)" opacity="0.4"/></g>
  <g class="drift" style="animation-duration:28s;animation-delay:-20s"><path fill="#e45a95" d="M0 6 C0 -2 12 -2 12 6 C12 -2 24 -2 24 6 C24 14 12 20 12 24 C12 20 0 14 0 6 Z" transform="translate(34 0) scale(0.8)" opacity="0.45"/></g>

  <!-- window -->
  <rect x="60" y="40" width="1080" height="680" rx="16" fill="#f5e6b8" fill-opacity="0.62" stroke="#3a2a1a" stroke-opacity="0.12"/>
  <circle cx="86" cy="64" r="6" fill="#3a2a1a" fill-opacity="0.18"/>
  <circle cx="106" cy="64" r="6" fill="#3a2a1a" fill-opacity="0.18"/>
  <circle cx="126" cy="64" r="6" fill="#3a2a1a" fill-opacity="0.18"/>
  <text x="600" y="69" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b533d">Brie Mine 🧀</text>
  <line x1="60" y1="88" x2="1140" y2="88" stroke="#3a2a1a" stroke-opacity="0.1"/>

  <!-- sidebar -->
  <path d="M60 88 H300 V720 H76 Q60 720 60 704 Z" fill="#f9eecb" fill-opacity="0.62"/>
  <line x1="300" y1="88" x2="300" y2="720" stroke="#3a2a1a" stroke-opacity="0.1"/>
  <text x="88" y="114" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1" fill="#6b533d" font-weight="600">SESSIONS</text>
  <rect x="72" y="128" width="216" height="34" rx="9" fill="#d02c75" fill-opacity="0.16"/><rect x="72" y="135" width="3" height="20" rx="1.5" fill="#d02c75"/>
  <text x="88" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#3a2a1a" font-weight="600">Cozy cheese shop ✨</text>
  
  <text x="88" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#5c4430" font-weight="400">Fix the login page</text>
  
  <text x="88" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#5c4430" font-weight="400">Plan the picnic 🧺</text>
  
  <text x="88" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#5c4430" font-weight="400">Grate expectations</text>
  
  <text x="88" y="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#5c4430" font-weight="400">Gouda morning notes</text>

  <!-- conversation -->
  <rect x="664" y="112" width="440" height="52" rx="14" fill="#fcf5df" fill-opacity="0.92" stroke="#3a2a1a" stroke-opacity="0.08"/>
  <text x="684" y="143" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#3a2a1a">Can you make my app feel like a cozy cheese shop? 🧀</text>

  <text x="340" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#3a2a1a">Of course! Here's a look with butter-cream surfaces, a pink</text>
  <text x="340" y="236" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#3a2a1a">accent, and a few holes for good measure:</text>

  <rect x="340" y="262" width="764" height="208" rx="10" fill="#f9eecb" fill-opacity="0.95" stroke="#3a2a1a" stroke-opacity="0.12"/>
  <text x="362" y="290" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="12" fill="#6b533d">register.tsx</text>
  <line x1="340" y1="304" x2="1104" y2="304" stroke="#3a2a1a" stroke-opacity="0.1"/>
  <text x="362" y="332" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" xml:space="preserve" fill="#3a2a1a"><tspan fill="#90144c">const</tspan><tspan> </tspan><tspan fill="#72450e">look</tspan><tspan> = </tspan><tspan fill="#892e1e">makeColors</tspan><tspan>({</tspan></text>
  <text x="362" y="356" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" xml:space="preserve" fill="#3a2a1a"><tspan>  label: </tspan><tspan fill="#335d25">'Brie Mine'</tspan><tspan>,</tspan></text>
  <text x="362" y="380" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" xml:space="preserve" fill="#3a2a1a"><tspan>  roles: { accent: </tspan><tspan fill="#335d25">'#d6337a'</tspan><tspan> },</tspan></text>
  <text x="362" y="404" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" xml:space="preserve" fill="#3a2a1a"><tspan>  holes: </tspan><tspan fill="#673687">6</tspan><tspan>,</tspan></text>
  <text x="362" y="428" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" xml:space="preserve" fill="#3a2a1a"><tspan>})</tspan></text>
  <text x="362" y="452" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" xml:space="preserve" fill="#3a2a1a"><tspan fill="#90144c">await</tspan><tspan> $.theme.</tspan><tspan fill="#892e1e">set</tspan><tspan>(</tspan><tspan fill="#72450e">look</tspan><tspan>)</tspan></text>

  <rect x="340" y="490" width="150" height="30" rx="15" fill="#4f8a3a" fill-opacity="0.18"/>
  <text x="358" y="510" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#335d25" font-weight="600">✓ Theme applied</text>
  <text x="340" y="556" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#5c4430">Enjoy your brie-lliant new look! 💖</text>

  <!-- prompt box -->
  <rect x="340" y="610" width="764" height="82" rx="16" fill="#fcf5df" fill-opacity="0.95" stroke="#3a2a1a" stroke-opacity="0.14"/>
  <text x="364" y="644" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#6b533d">Ask for more cheese…</text>
  <circle cx="1070" cy="664" r="18" fill="#d02c75"/>
  <path d="M1070 673 V656 M1062 663 L1070 655 L1078 663" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
